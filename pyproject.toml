[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "natlean"
dynamic = ["version"]
description = "Natural-language Lean: step-by-step probabilistic checking of arguments with a lightweight LLM"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kimio Kuramitsu", email = "kkuramitsu@gmail.com" }]
keywords = ["logic", "argumentation", "reasoning", "llm", "claude", "lean", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Natural Language :: Japanese",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "anthropic>=0.88",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build", "twine>=7"]

[project.scripts]
natlean = "natlean.cli:main"

[project.urls]
Homepage = "https://github.com/kkuramitsu/NatLean"
Issues = "https://github.com/kkuramitsu/NatLean/issues"

[tool.hatch.version]
path = "src/natlean/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/natlean"]

[tool.hatch.build.targets.sdist]
include = ["src/natlean", "tests", "examples", "README.md", "LICENSE", "CLAUDE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["api: Anthropic API を実際に呼ぶテスト（ANTHROPIC_API_KEY が必要）"]
